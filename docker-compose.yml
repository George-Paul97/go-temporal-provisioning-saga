services:
  postgres:
    image: postgres:16-alpine
    container_name: gtp_postgres
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: gtp_temporal
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # IMPORTANT: must be postgres12 or postgres12_pgx for this image
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal

      # DB names used by Temporal (main + visibility)
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility

      # for local dev
      DEFAULT_NAMESPACE: default
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.27.2
    container_name: gtp_temporal_ui
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8080:8080"

volumes:
  pgdata:
